<img src="main.png" alt="Afterglow 图标"><h1>Afterglow 1.0.0</h1>
<p>320×240 复古仪表时钟：IBM 3270 等宽时间码、日期和麦克风示波器。</p>
<ul><li>左右倾斜设备，循环切换 EL 琥珀、VFD 青蓝、CRT 绿色主题。</li><li>短按 HOME 返回启动器。</li><li>低输入以 8× 显示；大输入自动压缩，回落后逐档恢复。</li><li>COMP: ON 表示压缩生效；右下 dB 表示显示增益衰减量，并非声压测量值。</li></ul>
<p>采用清晰、无辉光的显示，VFD 与 CRT 为配色主题；缺少麦克风接口时使用内部示意波形。</p>
<p>时间使用设备系统时钟；请先在系统中设置时区并完成校时。附带字体遵循 FONT-LICENSE.txt。</p></html>
